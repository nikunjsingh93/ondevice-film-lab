<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Sign in · OnDevice Film Lab</title>
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="authPage">
  <main class="authWrap">
    <section class="authCard">
      <div class="authBrand"><img src="/branding/ondevice-film-lab-logo-v4.png" alt=""><div><h1>OnDevice Film Lab</h1><p>SERVER LAB</p></div></div>
      <form id="loginForm">
        <div class="authIntro"><h2>Welcome back</h2><p>Sign in to open your private photo library.</p></div>
        <label>Username<input id="username" name="username" autocomplete="username" required autofocus></label>
        <label>Password<input id="password" name="password" type="password" autocomplete="current-password" required></label>
        <button class="primary authSubmit" type="submit">Sign in</button>
      </form>
      <form id="changeForm" hidden>
        <div class="authIntro"><h2>Secure your account</h2><p>Change the temporary password before opening Server Lab.</p></div>
        <label>Username<input id="changeUsername" autocomplete="username" required></label>
        <label>Current password<input id="currentPassword" type="password" autocomplete="current-password" required></label>
        <label>New password<input id="newPassword" type="password" minlength="8" autocomplete="new-password" required></label>
        <label>Confirm new password<input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></label>
        <button class="primary authSubmit" type="submit">Save and continue</button>
      </form>
      <p id="authError" class="formError" role="alert" hidden></p>
      <p class="authPrivacy">Every account has its own private photos, edits, exports, profiles and LUTs.</p>
    </section>
  </main>
  <script src="/auth.js"></script>
</body>
</html>
