<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Settings · OnDevice Film Lab</title>
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="appShell settingsShell">
    <header class="appHeader">
      <a class="brand" href="/"><img src="/branding/ondevice-film-lab-logo-v4.png" alt=""><span><strong>Settings</strong><small>SERVER LAB</small></span></a>
      <div class="headerActions"><a class="buttonLink" href="/">Back to gallery</a><button id="logoutButton" type="button">Sign out</button></div>
    </header>
    <main class="settingsMain">
      <section class="settingsCard">
        <p class="eyebrow">YOUR ACCOUNT</p><h1>Account settings</h1>
        <form id="accountForm" class="settingsForm">
          <label>Username<input id="accountUsername" autocomplete="username" required></label>
          <label>Current password<input id="accountCurrentPassword" type="password" autocomplete="current-password" required></label>
          <label>New password <small>Leave blank to keep it</small><input id="accountNewPassword" type="password" minlength="8" autocomplete="new-password"></label>
          <button class="primary" type="submit">Save account</button>
        </form>
      </section>
      <section id="adminSection" class="settingsCard" hidden>
        <p class="eyebrow">ADMINISTRATION</p><h2>People and storage</h2><p class="settingsHelp">Create private accounts and choose how much Server Lab storage each person can use.</p>
        <form id="newUserForm" class="newUserForm">
          <label>Username<input id="newUsername" required></label>
          <label>Temporary password<input id="newUserPassword" type="password" minlength="8" required></label>
          <label>Storage in GB <small>Blank is unlimited</small><input id="newUserQuota" type="number" min="0.05" step="0.1" inputmode="decimal"></label>
          <button class="primary" type="submit">Add account</button>
        </form>
        <div id="userList" class="userList"></div>
      </section>
    </main>
  </div>
  <div id="confirmOverlay" class="modalOverlay" hidden><div class="modalCard" role="dialog" aria-modal="true"><h2>Remove account?</h2><p id="confirmMessage"></p><div class="dialogActions"><button id="confirmCancel">Cancel</button><button id="confirmRemove" class="danger">Remove account</button></div></div></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="/settings.js"></script>
</body>
</html>
